name: PHP syntax

on:
  push:
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint mysqli drop-in without native extensions
        run: php -n -l api/db/MysqliDropInFunctions.php
