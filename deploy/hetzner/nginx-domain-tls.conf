# H7 — Vhost TLS do hostname; ativar somente após emissão do certificado do domínio.
# Mantém políticas e rotas do vhost IP; o certificado do IP não é reutilizado.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.erpcondominios.com.br;

    root /var/www/erpcondominios/current;
    index login.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/app.erpcondominios.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.erpcondominios.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    rewrite ^/new_uhf_tag\.fcgi$ /api/controlid/new_uhf_tag.php last;
    rewrite ^/new_user_identified\.fcgi$ /api/controlid/new_user_identified.php last;
    rewrite ^/new_card\.fcgi$ /api/controlid/new_card.php last;
    rewrite ^/new_qrcode\.fcgi$ /api/controlid/new_qrcode.php last;
    rewrite ^/device_is_alive\.fcgi$ /api/controlid/device_is_alive.php last;
    rewrite ^/dashboard/?$ /frontend/layout-base.html?page=dashboard last;
    rewrite ^/projetos/?$ /projetos_publico.php last;
    rewrite ^/projetos/([0-9]+)/?$ /projetos_publico.php?id=$1 last;
    rewrite "^/projetos/([a-z0-9][a-z0-9-]{2,59})/([0-9]+)/?$" /projetos_publico.php?tenant_slug=$1&id=$2 last;
    rewrite "^/projetos/([a-z0-9][a-z0-9-]{2,59})/?$" /projetos_publico.php?tenant_slug=$1 last;

    location ^~ /.well-known/acme-challenge/ { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/(?:AI-CONTEXT|Claude|docs|md|tests?|tools|bridge_local|sql|cron|PHPMailer|vendor|\.github|\.claude)(?:/|$) { return 404; }
    location ~* ^/(?:backup|backups|logs?|storage|tmp|temp|config|deploy)(?:/|$) { return 404; }
    location ~* ^/api/(?:testeAPI|error|helpers|vendor|controllers|models|email)(?:/|$) { return 404; }
    location ~* (?:^|/)error_log(?:/|$) { return 404; }
    location ~* (?:^|/)(?:config|configuration|database|db|settings)(?:\.[^/]*)?\.php$ { return 404; }
    location ~* (?:^|/)(?:api_)?(?:teste|test|debug|diagnostico)(?:_[^/]*)?\.(?:php|txt)$ { return 404; }
    location ~* (?:^|/)[^/]+_(?:teste|test|debug|diagnostico)(?:_[^/]*)?\.(?:php|txt)$ { return 404; }
    location ~* (?:^|/)[^/]*_(?:backup|old|original|final|corrigida|corrigido)(?:_[^/]*)?\.(?:php|txt)$ { return 404; }
    location ~* \.(?:md|txt|ini|log|bak|backup|old|orig|original|save|tmp|sql|dump|sqlite|zip|tar|gz|rar|py|sh|bat|lnk|example|deprecated)$ { return 404; }

    # Equivalente ao uploads/.htaccess: caminhos legados são resolvidos pela API autenticada.
    location ^~ /uploads/ {
        rewrite ^/uploads/(.+)$ /api/api_arquivos_tenant.php?acao=legado&caminho=uploads/$1? last;
        return 404;
    }

    location ~* \.(?:gif|jpg|jpeg|png|css|js|svg|ico|woff|woff2|ttf|eot|json|xml|webmanifest)$ {
        try_files $uri =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
    }

    location ~* \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~* \.[^/]+$ { return 404; }

    location = / {
        default_type text/html;
        include snippets/erp-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        root /var/www/erpcondominios/current;
        try_files /frontend/login.html =404;
    }

    location = /frontend/login.html {
        absolute_redirect off;
        return 301 /$is_args$args;
    }

    location = /login.html {
        absolute_redirect off;
        return 301 /$is_args$args;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }
}
